name: Endor Scanner Image

on:
  workflow_dispatch:
    inputs:
      trial-package:
        description: "Publish from main, run one trial, or scan the 93 remaining official plugins"
        type: choice
        default: none
        options:
          - none
          - official-remaining
          - "@openclaw/discord@2026.9.9"
          - "@openclaw/codex@2026.9.9"
          - "@jason-vaughan/openclaw-google-oauth@0.4.0"
      saved-endor-only:
        description: "Save Endor results in its dashboard without running the AI profile"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && !inputs['saved-endor-only'] && (!inputs['trial-package'] || inputs['trial-package'] == 'none')
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/clawhub-endor:${{ github.sha }}
      ENDORCTL_VERSION: v1.7.1115
      ENDORCTL_SHA256: 4022e91a39d04f852f8a6195a5f98297af6cf2738f4012b1591bc87976136d4b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and check scanner image
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://api.endorlabs.com/download/endorlabs/$ENDORCTL_VERSION/binaries/endorctl_${ENDORCTL_VERSION}_linux_amd64" \
            --output scripts/security/endor/endorctl
          docker build --platform linux/amd64 \
            --build-arg "ENDORCTL_SHA256=$ENDORCTL_SHA256" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$IMAGE" scripts/security/endor
          sh scripts/security/check-endor-image.sh "$IMAGE"

      - name: Publish image and report digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          printf 'Set CODEX_SECURITY_SCAN_ENDOR_IMAGE to %s before enabling Endor.\n' "$digest" >> "$GITHUB_STEP_SUMMARY"

  select:
    if: inputs['trial-package'] && inputs['trial-package'] != 'none'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select frozen plugin releases
        id: packages
        env:
          SELECTION: ${{ inputs['trial-package'] }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          official = json.loads(Path("scripts/security/endor-official-plugins.json").read_text())
          selection = os.environ["SELECTION"]
          community = "@jason-vaughan/openclaw-google-oauth@0.4.0"
          if selection == "official-remaining":
              # Codex already completed the full hosted profile in run 38362196418.
              packages = [package for package in official if package != "@openclaw/codex@2026.9.9"]
          elif selection in ("@openclaw/discord@2026.9.9", "@openclaw/codex@2026.9.9", community):
              packages = [selection]
          else:
              raise ValueError("Select a frozen trial or the remaining official plugins")
          include = []
          for package in packages:
              trusted = package in official and package != community
              sha256 = official[package] if package != community else "5572178dc9ef4ca2d86d39c2de16b55c46e9e947710cdd84af2dd8dea45b3078"
              include.append({"package": package, "sha256": sha256, "trusted": trusted,
                              "artifact": package.removeprefix("@").replace("/", "-").replace("@", "-")})
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps({"include": include}, separators=(",", ":")) + "\n")
          PYTHON

  trial:
    needs: select
    name: Scan ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      TRIAL_PACKAGE: ${{ matrix.package }}
      TRIAL_SHA256: ${{ matrix.sha256 }}
      TRUSTED_OPENCLAW: ${{ matrix.trusted }}
      SAVED_ENDOR_ONLY: ${{ inputs['saved-endor-only'] }}
      TRIAL_DIR: .artifacts/endor-plugin-trial
      REPORT_DIR: .artifacts/endor-plugin-report
      CODEX_SECURITY_SCAN_CLAWSCAN_TIMEOUT_MS: "900000"
      CODEX_SECURITY_SCAN_CLAWSCAN_SANDBOX: "off"
      SKILLSPECTOR_PROVIDER: openai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-python@v7
        if: ${{ !inputs['saved-endor-only'] }}
        with:
          python-version: "3.12"

      - name: Download and validate one frozen plugin artifact
        run: |
          set -euo pipefail
          package_name="${TRIAL_PACKAGE%@*}"
          version="${TRIAL_PACKAGE##*@}"
          if [[ "$TRUSTED_OPENCLAW" == true ]]; then
            url="https://clawhub.ai/api/v1/packages/$package_name/versions/$version/artifact/download"
          else
            url="https://registry.npmjs.org/$package_name/-/${package_name##*/}-$version.tgz"
          fi
          printf 'TRIAL_ARTIFACT_URL=%s\n' "$url" >> "$GITHUB_ENV"
          mkdir -p "$TRIAL_DIR"
          curl --fail --location --retry 3 --max-filesize 52428800 \
            "$url" --output "$TRIAL_DIR/plugin.tgz"
          printf '%s  %s\n' "$TRIAL_SHA256" "$TRIAL_DIR/plugin.tgz" | sha256sum --check -
          bun - <<'JS'
          import { readFile } from "node:fs/promises";
          import { parseClawPack } from "./packages/clawhub/src/clawpack.ts";
          const packed = parseClawPack(await readFile(`${process.env.TRIAL_DIR}/plugin.tgz`));
          if (`${packed.packageName}@${packed.packageVersion}` !== process.env.TRIAL_PACKAGE || !packed.pluginManifest) {
            throw new Error("Frozen npm artifact identity or plugin manifest mismatch");
          }
          JS

      - name: Enable saved Endor scans in the trial image only
        if: ${{ inputs['saved-endor-only'] }}
        run: |
          python3 - <<'PYTHON'
          import os
          import shlex
          from pathlib import Path

          package_name, version = os.environ["TRIAL_PACKAGE"].rsplit("@", 1)
          origin = os.environ["TRIAL_ARTIFACT_URL"].replace("@", "%40")
          tags = f"plugin:{package_name},version:{version},trial:{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          path = Path("scripts/security/endor/scan.sh")
          script = path.read_text()
          replacements = {
              "remote add origin https://example.invalid/clawscan/scan-target.git": f"remote add origin {shlex.quote(origin)}",
              "endorctl scan --dry-run ": f"endorctl scan --project-tags {shlex.quote(tags)} --tags {shlex.quote(tags)} --exit-on-policy-warning=false ",
          }
          for source, replacement in replacements.items():
              if script.count(source) != 1:
                  raise ValueError(f"Expected exactly one trial-image source: {source}")
              script = script.replace(source, replacement)
          path.write_text(script)
          PYTHON

      - name: Build and check pinned Endor image
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://api.endorlabs.com/download/endorlabs/v1.7.1115/binaries/endorctl_v1.7.1115_linux_amd64 \
            --output scripts/security/endor/endorctl
          docker build --platform linux/amd64 \
            --build-arg ENDORCTL_SHA256=4022e91a39d04f852f8a6195a5f98297af6cf2738f4012b1591bc87976136d4b \
            --tag "clawhub-endor-trial:$GITHUB_SHA" scripts/security/endor
          image=$(docker image inspect --format '{{.Id}}' "clawhub-endor-trial:$GITHUB_SHA")
          [[ "$image" =~ ^sha256:[a-f0-9]{64}$ ]]
          sh scripts/security/check-endor-image.sh "$image"
          printf 'CODEX_SECURITY_SCAN_ENDOR_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"

      - name: Install pinned Codex, ClawScan and SkillSpector
        if: ${{ !inputs['saved-endor-only'] }}
        run: |
          set -euo pipefail
          npm install --global @openai/codex@0.142.3 @openclaw/clawscan@0.2.0
          codex --version
          clawscan --version
          python -m venv "$RUNNER_TEMP/skillspector-venv"
          source "$RUNNER_TEMP/skillspector-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install 'git+https://github.com/NVIDIA/skillspector.git@69dcdfb74487d361ba4c811d088cfdea2ff3a9dc'
          echo "$RUNNER_TEMP/skillspector-venv/bin" >> "$GITHUB_PATH"
          skillspector --help >/dev/null

      - name: Prepare and verify Codex read-only sandbox
        if: ${{ !inputs['saved-endor-only'] }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap apparmor-profiles apparmor-utils
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          codex sandbox -c 'sandbox_mode="read-only"' -- /bin/sh -c '
            sha256sum scripts/security/codex-scan-output.schema.json >/dev/null &&
            ! touch .artifacts/endor-sandbox-write-probe
          '

      - name: Authenticate Codex CLI
        if: ${{ !inputs['saved-endor-only'] }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: printf '%s' "$OPENAI_API_KEY" | codex login --with-api-key

      - name: Run the report-only ClawHub plugin profile
        id: scan
        if: ${{ !inputs['saved-endor-only'] }}
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEFAULT_BASE_URL: https://api.openai.com/v1
          DEFAULT_MODEL: gpt-5.6
          ENDOR_NAMESPACE: ${{ vars.ENDOR_NAMESPACE }}
          ENDOR_API: ${{ vars.ENDOR_API }}
          ENDOR_API_CREDENTIALS_KEY: ${{ secrets.ENDOR_API_CREDENTIALS_KEY }}
          ENDOR_API_CREDENTIALS_SECRET: ${{ secrets.ENDOR_API_CREDENTIALS_SECRET }}
        run: |
          set -euo pipefail
          trust=()
          if [[ "$TRUSTED_OPENCLAW" == true ]]; then trust=(--trusted-openclaw); fi
          bun scripts/security/scan-local-plugins.ts "${trust[@]}" \
            --out "$TRIAL_DIR/results" "$TRIAL_DIR/plugin.tgz"

      - name: Run saved Endor without the AI profile
        id: saved-scan
        if: ${{ inputs['saved-endor-only'] }}
        env:
          ENDOR_NAMESPACE: ${{ vars.ENDOR_NAMESPACE }}
          ENDOR_API: ${{ vars.ENDOR_API }}
          ENDOR_API_CREDENTIALS_KEY: ${{ secrets.ENDOR_API_CREDENTIALS_KEY }}
          ENDOR_API_CREDENTIALS_SECRET: ${{ secrets.ENDOR_API_CREDENTIALS_SECRET }}
        run: |
          set -euo pipefail
          bun scripts/security/scan-local-plugins.ts --prepare-only \
            --out "$TRIAL_DIR/results" "$TRIAL_DIR/plugin.tgz"
          bun - <<'JS'
          import { readFile, writeFile } from "node:fs/promises";
          import { z } from "zod";
          import { runWorkerCommand } from "./scripts/lib/runWorkerCommand.ts";
          import { redactWorkerPublicErrorMessage } from "./scripts/lib/workerRedaction.ts";
          import { writeJobDiagnostic } from "./scripts/security/run-codex-scan-worker.ts";
          import { runEndorPluginScan, type EndorCommandDiagnostic } from "./scripts/security/run-endor-plugin-scan.ts";

          const reportPath = `${process.env.TRIAL_DIR}/results/report.json`;
          const reports = JSON.parse(await readFile(reportPath, "utf8"));
          if (reports.length !== 1 || `${reports[0].name}@${reports[0].version}` !== process.env.TRIAL_PACKAGE) {
            throw new Error("Saved Endor trial requires one prepared selected package");
          }
          const result = reports[0];
          result.endorSourceUrl = process.env.TRIAL_ARTIFACT_URL;
          const startedAt = Date.now();
          const endor: EndorCommandDiagnostic = {};
          try {
            result.endorAnalysis = await runEndorPluginScan({
              workspace: result.workspace,
              onDiagnostic: (next) => Object.assign(endor, next),
            });
            if (result.endorAnalysis.status !== "completed") {
              throw new Error("Saved Endor analysis did not complete");
            }
            const projects = [...(endor.stderr ?? "").matchAll(/^INFO: Scanning Project UUID: ([a-f0-9-]+) Tenant: (\S+)$/gm)];
            if (projects.length !== 1 || projects[0][2] !== process.env.ENDOR_NAMESPACE) {
              throw new Error("Saved Endor scan must identify one project in the configured namespace");
            }
            const uuid = projects[0][1];
            const endorKeys = ["ENDOR_API", "ENDOR_NAMESPACE", "ENDOR_API_CREDENTIALS_KEY", "ENDOR_API_CREDENTIALS_SECRET"];
            const readback = await runWorkerCommand("docker", [
              "run", "--rm", "--read-only", "--user", "1000:1000", "--cap-drop", "ALL",
              "--security-opt", "no-new-privileges:true", "--tmpfs", "/tmp:rw,nosuid,nodev,noexec", "--env", "HOME=/tmp",
              "--entrypoint", "/usr/local/bin/endorctl",
              ...endorKeys.filter((key) => process.env[key] !== undefined).flatMap((key) => ["--env", key]),
              process.env.CODEX_SECURITY_SCAN_ENDOR_IMAGE,
              "api", "get", "-r", "Project", "--uuid", uuid, "-n", process.env.ENDOR_NAMESPACE,
              "--field-mask", "uuid,meta.name,meta.tags,spec.git", "-o", "json",
            ], {
              commandLabel: "Endor saved project readback", cwd: result.workspace,
              env: Object.fromEntries(["PATH", "HOME", "DOCKER_CONFIG", ...endorKeys]
                .filter((key) => process.env[key] !== undefined).map((key) => [key, process.env[key]])),
              maxStdoutBytes: 1048576, maxStderrBytes: 32768, timeoutMs: 60000,
            });
            result.endorSavedProject = JSON.parse(readback.stdout);
            // GetProject returns the Project itself, as documented by the native API.
            const project = z.object({
              uuid: z.string(), meta: z.object({ tags: z.array(z.string()) }),
            }).parse(result.endorSavedProject);
            const expectedTags = [
              `plugin:${result.name}`, `version:${result.version}`,
              `trial:${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`,
            ];
            if (project.uuid !== uuid || !expectedTags.every((tag) => project.meta.tags.includes(tag))) {
              throw new Error("Saved Endor project identity does not match the selected artifact and trial");
            }
            result.endorSavedProject.identityVerified = true;
            result.status = "completed";
          } catch (error) {
            result.status = "failed";
            result.error = redactWorkerPublicErrorMessage(error instanceof Error ? error.message : String(error));
            endor.error = result.error;
            result.endorAnalysis ??= {
              status: "failed", checkedAt: Date.now(), reason: "Saved Endor analysis failed; inspect diagnostics.",
            };
          }
          result.durationMs = Date.now() - startedAt;
          await writeJobDiagnostic({
            job: {
              job: {
                _id: "local-1", leaseToken: "", targetKind: "packageRelease", source: "local-report",
                hasMaliciousSignal: false, waitForVtUntil: 0,
              },
              target: {
                package: { name: result.name }, release: { version: result.version, artifactKind: "npm-pack" },
              },
            },
            endor, diagnosticsRoot: `${process.env.TRIAL_DIR}/results/diagnostics`,
            startedAt, completedAt: Date.now(), status: result.status, error: result.error,
          });
          await writeFile(reportPath, JSON.stringify(reports, null, 2) + "\n");
          console.log(`${process.env.TRIAL_PACKAGE}: saved Endor ${result.status}`);
          if (result.status !== "completed") process.exitCode = 1;
          JS

      - name: Prepare bounded redacted reports
        id: report
        if: ${{ !cancelled() && (steps.scan.outcome != 'skipped' || steps.saved-scan.outcome != 'skipped') }}
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          cp -R "$TRIAL_DIR/results/diagnostics" "$REPORT_DIR/diagnostics"
          bun - <<'JS'
          import { readFile, writeFile } from "node:fs/promises";
          import { redactWorkerPublicText } from "./scripts/lib/workerRedaction.ts";
          const reports = JSON.parse(await readFile(`${process.env.TRIAL_DIR}/results/report.json`, "utf8"));
          // Workspaces contain scanner configuration and dependencies; upload only owned reports.
          const report = reports.map(({ artifact, workspace, ...result }) => result);
          await writeFile(`${process.env.REPORT_DIR}/report.json`, JSON.stringify(report, (_key, value) =>
            typeof value === "string" ? redactWorkerPublicText(value) : value, 2) + "\n");
          JS
          [[ -z "$(find "$REPORT_DIR" -type f -size +10485760c -print -quit)" ]] || { echo 'Trial report exceeds 10 MiB' >&2; exit 1; }
          bytes=$(du --bytes --summarize "$REPORT_DIR" | cut -f1)
          (( bytes <= 20971520 )) || { echo 'Trial reports exceed 20 MiB' >&2; exit 1; }
          echo 'artifact-ready=true' >> "$GITHUB_OUTPUT"

      - name: Verify selected scanners completed
        if: ${{ !cancelled() && steps.report.outputs.artifact-ready == 'true' }}
        run: |
          bun - <<'JS'
          import { readFile } from "node:fs/promises";
          const reports = JSON.parse(await readFile(`${process.env.REPORT_DIR}/report.json`, "utf8"));
          const savedEndorOnly = process.env.SAVED_ENDOR_ONLY === "true";
          if (reports.length !== 1 || `${reports[0].name}@${reports[0].version}` !== process.env.TRIAL_PACKAGE ||
              reports[0].status !== "completed" || reports[0].endorAnalysis?.status !== "completed" ||
              (!savedEndorOnly && !["benign", "suspicious", "malicious"].includes(reports[0].llmAnalysis?.verdict))) {
            throw new Error(`Trial requires completed Endor${savedEndorOnly ? "" : " and judge"} results for the selected package; inspect diagnostics`);
          }
          console.log(`${process.env.TRIAL_PACKAGE}: Endor completed${savedEndorOnly ? "" : `, judge verdict=${reports[0].llmAnalysis.verdict}`}`);
          JS

      - name: Scan reports for verified secrets
        id: report-secret-scan
        if: ${{ !cancelled() && steps.report.outputs.artifact-ready == 'true' }}
        run: |
          docker run --rm -v "$PWD/$REPORT_DIR:/scan:ro" \
            ghcr.io/trufflesecurity/trufflehog:3.95.5@sha256:56c25710275c4b8d74c4f1346a5e7c606fa7ff4afe996f680b288d0fae3fcd9c \
            filesystem /scan --only-verified --fail --no-update --github-actions

      - name: Upload redacted trial reports
        if: ${{ !cancelled() && steps.report-secret-scan.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: endor-plugin-${{ matrix.artifact }}-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}
          retention-days: 7
          if-no-files-found: error

name: Pre-publication Publish Checks

on:
  repository_dispatch:
    types:
      - clawhub-prepublication-publish
  workflow_dispatch:
    inputs:
      batch-limit:
        description: "Maximum staged publish attempts to check per worker shard"
        required: true
        default: "2"
      max-jobs:
        description: "Optional total attempts cap per worker shard"
        required: false
        default: ""
      max-runtime-minutes:
        description: "Stop claiming new attempts after this many minutes"
        required: true
        default: "15"
      attempt-id:
        description: "Optional exact publish attempt ID for targeted recovery"
        required: false
        default: ""
      kind:
        description: "Optional targeted recovery kind: skill or package"
        required: false
        default: ""
      slug:
        description: "Optional targeted recovery slug"
        required: false
        default: ""
      version:
        description: "Optional targeted recovery version"
        required: false
        default: ""
      runner:
        description: "Runner label for manual recovery dispatches"
        required: true
        default: "blacksmith-8vcpu-ubuntu-2404"
        type: choice
        options:
          - "blacksmith-8vcpu-ubuntu-2404"
          - "ubuntu-latest"
      target-environment:
        description: "Convex deployment to process for manual recovery"
        required: true
        default: production
        type: choice
        options:
          - production
          - test
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: ${{ (github.ref == 'refs/heads/staging' || github.event.client_payload.environment == 'staging') && format('staging-{0}-', github.ref_name) || ((github.event.client_payload.environment == 'test' || inputs['target-environment'] == 'test') && 'test-' || '') }}${{ (github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs['attempt-id'] != '')) && format('clawhub-prepublication-{0}', github.event.client_payload.attempt_id || inputs['attempt-id']) || 'clawhub-prepublication-publish-checks' }}
  cancel-in-progress: false

jobs:
  dispatch-staging:
    if: >-
      github.repository == 'openclaw/clawhub' &&
      github.event_name == 'repository_dispatch' &&
      github.event.client_payload.environment == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch staging worker
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT_ID: ${{ github.event.client_payload.attempt_id || '' }}
          KIND: ${{ github.event.client_payload.kind || '' }}
          SLUG: ${{ github.event.client_payload.slug || '' }}
          VERSION: ${{ github.event.client_payload.version || '' }}
          BATCH_LIMIT: ${{ github.event.client_payload.batch_limit || '1' }}
          MAX_JOBS: ${{ github.event.client_payload.max_jobs || '1' }}
          MAX_RUNTIME_MINUTES: ${{ github.event.client_payload.max_runtime_minutes || '20' }}
        run: |
          set -euo pipefail
          gh workflow run prepublication-publish-checks.yml --repo openclaw/clawhub --ref staging \
            -f attempt-id="$ATTEMPT_ID" \
            -f kind="$KIND" \
            -f slug="$SLUG" \
            -f version="$VERSION" \
            -f batch-limit="$BATCH_LIMIT" \
            -f max-jobs="$MAX_JOBS" \
            -f max-runtime-minutes="$MAX_RUNTIME_MINUTES"

  dispatch-test:
    if: >-
      github.repository == 'openclaw/clawhub' &&
      github.event_name == 'repository_dispatch' &&
      github.event.client_payload.environment == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch Test worker
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT_ID: ${{ github.event.client_payload.attempt_id || '' }}
          KIND: ${{ github.event.client_payload.kind || '' }}
          SLUG: ${{ github.event.client_payload.slug || '' }}
          VERSION: ${{ github.event.client_payload.version || '' }}
          BATCH_LIMIT: ${{ github.event.client_payload.batch_limit || '1' }}
          MAX_JOBS: ${{ github.event.client_payload.max_jobs || '1' }}
          MAX_RUNTIME_MINUTES: ${{ github.event.client_payload.max_runtime_minutes || '20' }}
        run: |
          set -euo pipefail
          gh workflow run prepublication-publish-checks.yml --repo openclaw/clawhub --ref main \
            -f target-environment=test \
            -f attempt-id="$ATTEMPT_ID" \
            -f kind="$KIND" \
            -f slug="$SLUG" \
            -f version="$VERSION" \
            -f batch-limit="$BATCH_LIMIT" \
            -f max-jobs="$MAX_JOBS" \
            -f max-runtime-minutes="$MAX_RUNTIME_MINUTES"

  reject-test-target-on-staging-ref:
    if: >-
      github.repository == 'openclaw/clawhub' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/staging' &&
      inputs['target-environment'] == 'test'
    runs-on: ubuntu-latest
    steps:
      - name: Reject mismatched branch and target
        run: |
          echo "::error::Test recovery must run from main so the worker code matches the Test deployment"
          exit 1

  prepublication-publish-checks:
    if: >-
      github.repository == 'openclaw/clawhub' &&
      ((github.ref == 'refs/heads/main' &&
        (github.event_name != 'repository_dispatch' ||
         (github.event.client_payload.environment != 'staging' &&
          github.event.client_payload.environment != 'test')) &&
        (github.event_name != 'workflow_dispatch' || inputs['target-environment'] != 'test')) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging' &&
        inputs['target-environment'] != 'test') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
        inputs['target-environment'] == 'test'))
    name: Pre-publication publish checks shard ${{ matrix.shard }}
    runs-on: ${{ inputs.runner || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 25
    environment: ${{ github.ref == 'refs/heads/staging' && 'Staging' || (github.ref == 'refs/heads/main' && inputs['target-environment'] == 'test' && 'Test' || 'Production') }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ${{ fromJSON((github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs['attempt-id'] != '')) && '[0]' || '[0,1]') }}
    env:
      CONVEX_URL: ${{ github.ref == 'refs/heads/staging' && 'https://cheery-civet-733.convex.cloud' || (github.ref == 'refs/heads/main' && inputs['target-environment'] == 'test' && 'https://academic-chihuahua-392.convex.cloud' || vars.CONVEX_URL || vars.VITE_CONVEX_URL || 'https://wry-manatee-359.convex.cloud') }}
      PREPUBLICATION_WORKER_ENVIRONMENT: ${{ github.ref == 'refs/heads/staging' && 'staging' || (github.ref == 'refs/heads/main' && inputs['target-environment'] == 'test' && 'test' || 'production') }}
      PREPUBLICATION_CHECK_LIMIT: ${{ github.event.client_payload.batch_limit || inputs['batch-limit'] || '2' }}
      PREPUBLICATION_CHECK_MAX_JOBS: ${{ github.event.client_payload.max_jobs || inputs['max-jobs'] || '' }}
      PREPUBLICATION_CHECK_MAX_RUNTIME_MINUTES: ${{ github.event.client_payload.max_runtime_minutes || inputs['max-runtime-minutes'] || '15' }}
      PREPUBLICATION_CHECK_ATTEMPT_ID: ${{ github.event.client_payload.attempt_id || inputs['attempt-id'] || '' }}
      PREPUBLICATION_CHECK_KIND: ${{ github.event.client_payload.kind || inputs.kind || '' }}
      PREPUBLICATION_CHECK_SLUG: ${{ github.event.client_payload.slug || inputs.slug || '' }}
      PREPUBLICATION_CHECK_VERSION: ${{ github.event.client_payload.version || inputs.version || '' }}
      PREPUBLICATION_CLAWSCAN_TIMEOUT_MS: ${{ vars.PREPUBLICATION_CLAWSCAN_TIMEOUT_MS || '900000' }}
      # The runner is disposable and installs the reviewed, hash-locked host scanners above.
      PREPUBLICATION_CLAWSCAN_SANDBOX: "off"
      PREPUBLICATION_TRUFFLEHOG_IMAGE: ${{ vars.PREPUBLICATION_TRUFFLEHOG_IMAGE || 'ghcr.io/trufflesecurity/trufflehog:3.95.6@sha256:96f8429082cb2d4ae73b1096dcdb2f5aa139881d97042b0c5e5fa226a392e056' }}
      PREPUBLICATION_WORKER_ID: "github-actions:${{ github.run_id }}:${{ github.run_attempt }}:${{ matrix.shard }}"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-bun

      - name: Verify staging worker target
        if: github.ref == 'refs/heads/staging'
        run: bun scripts/security/check-staging-worker-target.ts

      - name: Verify permanent Test worker target
        if: github.ref == 'refs/heads/main' && inputs['target-environment'] == 'test'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ "$CONVEX_URL" != "https://academic-chihuahua-392.convex.cloud" ||
                "$GITHUB_REF" != "refs/heads/main" ||
                "$CONVEX_DEPLOY_KEY" != prod:academic-chihuahua-392\|* ]]; then
            echo "::error::Test prepublication workers must use academic-chihuahua-392 from main"
            exit 1
          fi
          test_environment="$(bunx convex env get CLAWHUB_ENV --prod)"
          if [[ "$test_environment" != "test" ]]; then
            echo "::error::Target Convex deployment is not marked Test"
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Codex CLI
        run: |
          set -euo pipefail
          npm install -g @openai/codex@0.142.3
          codex --version

      - name: Install ClawScan CLI
        run: |
          set -euo pipefail
          npm install -g @openclaw/clawscan@0.1.8
          clawscan --version

      - name: Install SkillSpector
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/skillspector-venv"
          source "$RUNNER_TEMP/skillspector-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install 'git+https://github.com/NVIDIA/skillspector.git@69dcdfb74487d361ba4c811d088cfdea2ff3a9dc'
          echo "$RUNNER_TEMP/skillspector-venv/bin" >> "$GITHUB_PATH"
          skillspector --help >/dev/null

      - name: Install A.I.G scanner
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r scripts/security/aig-worker-requirements.txt
          python -c 'from importlib.metadata import version; assert version("aig-skill-scan") == "0.2.2"'
          python -c 'import inspect; from skill_scan.utils.llm import LLM; assert "temperature=" not in inspect.getsource(LLM.chat_stream)'
          aig-skill-scan --help >/dev/null

      - name: Run Test pre-publication publish worker
        if: github.ref == 'refs/heads/main' && inputs['target-environment'] == 'test'
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY || secrets.OPENAI_API_KEY }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          DEFAULT_BASE_URL: https://api.openai.com/v1
          DEFAULT_MODEL: gpt-5.6
          LLM_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.CODEX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          worker_token="$(bunx convex env get SECURITY_SCAN_WORKER_TOKEN --prod)"
          if [[ -z "$worker_token" ]]; then
            echo "::error::Test SECURITY_SCAN_WORKER_TOKEN is missing"
            exit 1
          fi
          printf '::add-mask::%s\n' "$worker_token"
          unset CONVEX_DEPLOY_KEY
          SECURITY_SCAN_WORKER_TOKEN="$worker_token" bun run publish:prepublication-worker
          unset worker_token

      - name: Run pre-publication publish worker
        if: github.ref != 'refs/heads/main' || inputs['target-environment'] != 'test'
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY || secrets.OPENAI_API_KEY }}
          DEFAULT_BASE_URL: https://api.openai.com/v1
          DEFAULT_MODEL: gpt-5.6
          LLM_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.CODEX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SECURITY_SCAN_WORKER_TOKEN: ${{ secrets.SECURITY_SCAN_WORKER_TOKEN }}
        run: bun run publish:prepublication-worker

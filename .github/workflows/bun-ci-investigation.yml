name: Bun CI owner proof

on:
  push:
    branches: [investigate/bun-ci-owner-proof-20261102]

permissions:
  contents: read

jobs:
  cold:
    name: cold / mcporter / ${{ matrix.tool }}
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: &mac-matrix
        tool: [baseline, candidate]
        include:
          - tool: baseline
            sha: 8ba0ef967805b8d3fca7a9bc47c725a476e1282b
          - tool: candidate
            sha: 39b2ac7ec2cebdff9a900aa1922338b704229b9c
    env: &mac-env
      PROOF_REPOSITORY: mcporter
      PROOF_TOOL: ${{ matrix.tool }}
      PROOF_CI_MAC_ONLY: "1"
      SOURCE_SHA: ${{ matrix.sha }}
      SOURCE_DIRECTORY: source
      NO_COLOR: "1"
      FORCE_COLOR: "0"
    steps:
      - name: Configure task-only paths
        run: &paths |
          printf 'BUN_INSTALL_CACHE_DIR=%s/bun-ci-cache/bun\nCOREPACK_HOME=%s/bun-ci-cache/corepack\nPROOF_BUN=%s/bun-ci-tools/bun-darwin-aarch64/bun\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/mcporter
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.1
      - name: Require genuinely cold task caches
        run: test ! -e "$RUNNER_TEMP/bun-ci-cache" && test ! -e "$RUNNER_TEMP/bun-ci-tools" && test ! -e source/node_modules
      - name: Provision identical existing native pins
        run: &provision |
          set -euo pipefail
          test "$(uname -m)" = arm64
          corepack enable
          corepack prepare pnpm@10.34.6 --activate
          test "$(pnpm --version)" = 10.34.6
          if [[ ! -e "$PROOF_BUN" ]]; then
            mkdir -p "$RUNNER_TEMP/bun-ci-tools"
            curl --fail --location --silent --show-error -o "$RUNNER_TEMP/bun-ci-tools/bun.zip" https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-darwin-aarch64.zip
            printf '%s  %s\n' c240d7f0ccb90c263a849fcdb09b7ee62630d921348ed6aafda86b9d577bc510 "$RUNNER_TEMP/bun-ci-tools/bun.zip" | shasum -a 256 -c -
            unzip -q "$RUNNER_TEMP/bun-ci-tools/bun.zip" -d "$RUNNER_TEMP/bun-ci-tools"
            ln -s bun "$RUNNER_TEMP/bun-ci-tools/bun-darwin-aarch64/bunx"
          fi
          test "$($PROOF_BUN --version)" = 1.4.4
          echo "$RUNNER_TEMP/bun-ci-tools/bun-darwin-aarch64" >> "$GITHUB_PATH"
      - name: Install frozen source into fresh workspace
        run: &install |
          set -euo pipefail
          test ! -e source/node_modules
          cd source
          start=$(node -p 'process.hrtime.bigint().toString()')
          pnpm install --frozen-lockfile --engine-strict --store-dir "$RUNNER_TEMP/bun-ci-cache/pnpm"
          finish=$(node -p 'process.hrtime.bigint().toString()')
          echo "BUN_CI_INSTALL {\"nanoseconds\":$((finish-start))}"
      - name: Actual macOS format command and controls
        id: proof
        continue-on-error: true
        env:
          PROOF_PHASE: cold
        run: node harness/scripts/bun-ci-investigation.mjs
      - name: Save only task stores/tools, never node_modules
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/bun-ci-cache
            ${{ runner.temp }}/bun-ci-tools
          key: bun-ci-mac-proof-${{ github.sha }}-${{ matrix.tool }}
      - if: steps.proof.outcome != 'success'
        run: exit 1
  restored:
    name: restored / mcporter / ${{ matrix.tool }}
    needs: cold
    if: always() && needs.cold.result != 'cancelled'
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: *mac-matrix
    env: *mac-env
    steps:
      - name: Configure task-only paths
        run: *paths
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/mcporter
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.1
      - name: Restore exact task cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/bun-ci-cache
            ${{ runner.temp }}/bun-ci-tools
          key: bun-ci-mac-proof-${{ github.sha }}-${{ matrix.tool }}
          fail-on-cache-miss: true
      - name: Require cache hit and fresh workspace
        run: test '${{ steps.cache.outputs.cache-hit }}' = true && test ! -e source/node_modules
      - name: Provision identical existing native pins
        run: *provision
      - name: Install from restored stores into fresh workspace
        run: *install
      - name: Actual macOS format command and controls
        env:
          PROOF_PHASE: restored
        run: node harness/scripts/bun-ci-investigation.mjs

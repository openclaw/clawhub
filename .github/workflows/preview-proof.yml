name: Preview Proof

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Vercel preview URL to verify"
        required: true
        type: string
      checkout_ref:
        description: "Optional git ref or SHA to check out; use this when dispatching from main for a PR preview"
        required: false
        type: string
      expected_sha:
        description: "Expected git SHA after checkout"
        required: true
        type: string

      fixture_slug:
        description: "Existing seeded preview skill to verify; never creates data"
        required: false
        default: "02-team-operation"
        type: string

permissions:
  contents: read

jobs:
  dispatch-info:
    name: preview-proof-dispatch-info
    runs-on: ubuntu-latest
    steps:
      - name: Summarize dispatch
        env:
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          {
            echo "## Preview proof dispatch"
            echo
            echo "- Workflow ref: \`${GITHUB_REF}\`"
            echo "- Workflow SHA: \`${GITHUB_SHA}\`"
            echo "- Checkout ref: \`${CHECKOUT_REF:-$GITHUB_SHA}\`"
            echo "- Expected SHA: \`${EXPECTED_SHA:-not supplied}\`"
            echo "- Preview URL: ${PREVIEW_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::notice::Protected preview proof only runs from refs/heads/main. Re-run from main with checkout_ref set to the PR SHA."
          fi

  preview-proof:
    name: preview-proof
    needs: dispatch-info
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Test

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Verify checked-out revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "actual_sha=$actual_sha" >> "$GITHUB_ENV"
          if [[ -n "$EXPECTED_SHA" && "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Expected $EXPECTED_SHA but checked out $actual_sha"
            exit 1
          fi

      - uses: ./.github/actions/setup-bun

      - name: Install proof browser
        run: bunx playwright install --with-deps chromium

      - name: Verify protected preview routes and dormant analytics policy
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CLAWHUB_E2E_SKILL_SLUG: ${{ inputs.fixture_slug || '02-team-operation' }}
          CLAWHUB_E2E_SKILL_OWNER: ""
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: bun scripts/verify-preview-proof.ts

      - name: Preserve proof receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-proof-${{ inputs.expected_sha }}
          path: .artifacts/preview-proof.json
          if-no-files-found: warn

      - name: Write proof summary
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          {
            echo "## Preview proof"
            echo
            echo "- Git SHA: \`${actual_sha}\`"
            echo "- Preview URL: ${PREVIEW_URL}"
            echo "- Verified: seeded skill detail and file, home, strict v2 region/cache/spoof policy, served SHA, reviewed source switch, and zero Google requests with a seeded grant on preview"
          } >> "$GITHUB_STEP_SUMMARY"

name: Skill Evaluation DeepStream Setup Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.11"
      - uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.1.4
      - name: Install pinned public evaluator and source inputs
        run: |
          git clone --quiet --branch v0.5.0 --depth 1 https://github.com/NVIDIA/SkillEvaluator.git /tmp/evaluator
          test "$(git -C /tmp/evaluator rev-parse HEAD)" = "7304d76cde371287b67ea99653409d014b6b9c85"
          uv sync --project /tmp/evaluator --extra tier3 --frozen
          git init --quiet /tmp/nvidia-skills
          git -C /tmp/nvidia-skills remote add origin https://github.com/NVIDIA/skills.git
          git -C /tmp/nvidia-skills sparse-checkout set skills/deepstream-import-vision-model
          git -C /tmp/nvidia-skills fetch --quiet --depth 1 --filter=blob:none origin 392ab8ab2587345a9d86240967f666bd59ac82ca
          git -C /tmp/nvidia-skills checkout --quiet --detach FETCH_HEAD
      - name: Reproduce the generated DeepStream Docker setup error
        run: |
          env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 uv run --project /tmp/evaluator --frozen --extra tier3 python -u - <<'PY'
          import asyncio, json, tempfile, tomllib
          from pathlib import Path
          from harbor.models.task.config import EnvironmentConfig
          from harbor.models.trial.paths import TrialPaths
          from skillevaluator.tier3.harbor.adapter import generate_harbor_tasks
          from skillevaluator.tier3.harbor.secure_docker_environment import SkillEvaluatorSecureDockerEnvironment

          async def main():
              with tempfile.TemporaryDirectory(prefix='deepstream-setup-probe-') as directory:
                  root = Path(directory)
                  source = Path('/tmp/nvidia-skills/skills/deepstream-import-vision-model')
                  tasks = generate_harbor_tasks(source, root / 'tasks', arm_suffix='-with-skill')
                  task = tasks[0]
                  config = tomllib.loads((task / 'task.toml').read_text())
                  sandbox = SkillEvaluatorSecureDockerEnvironment(
                      environment_dir=task / 'environment',
                      environment_name='skillevaluator-' + task.name + '-with-skill',
                      session_id='deepstream-dependency-probe',
                      trial_paths=TrialPaths(trial_dir=root / 'trial'),
                      task_env_config=EnvironmentConfig.model_validate(config.get('environment', {})),
                  )
                  failure = None
                  try:
                      await sandbox.start(force_build=False)
                  except Exception as error:
                      failure = str(error)
                      print(json.dumps({'task': task.name, 'setupError': failure[-16000:]}), flush=True)
                  finally:
                      await sandbox.stop(delete=True)
                  assert failure and 'Invalid requirement' in failure and 'torchvision' in failure, 'Expected inline-comment requirement failure was not reproduced'
                  print(json.dumps({'diagnostic': 'deepstream-import-vision-model', 'result': 'invalid-inline-requirement-reproduced-in-generated-Docker-build'}), flush=True)

          asyncio.run(main())
          PY

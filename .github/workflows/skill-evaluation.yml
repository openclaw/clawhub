name: Skill Evaluation Docker Name Reproduction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.11"
      - uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.1.4
      - name: Install exact Harbor dependency through pinned evaluator
        run: |
          git clone --quiet --branch v0.5.0 --depth 1 https://github.com/NVIDIA/SkillEvaluator.git /tmp/evaluator
          test "$(git -C /tmp/evaluator rev-parse HEAD)" = "7304d76cde371287b67ea99653409d014b6b9c85"
          uv sync --project /tmp/evaluator --extra tier3 --frozen
      - name: Compare original and trailing-dot-safe trial names
        run: |
          env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 uv run --project /tmp/evaluator --frozen --extra tier3 python -u - <<'PY'
          import inspect, json, re, subprocess, tempfile, textwrap
          from pathlib import Path
          from types import SimpleNamespace
          from harbor.models.trial.config import TrialConfig

          original = TrialConfig.generate_trial_name
          source = textwrap.dedent(inspect.getsource(original))
          assert source.count("rstrip('_-')") == 1
          namespace = dict(original.__globals__)
          exec(source.replace("rstrip('_-')", "rstrip('_-.' )"), namespace)
          corrected = namespace['generate_trial_name']
          cases = [
              'doca-compress.explicit-positive.v1',
              'doca-compress.implicit-positive.v2',
              'doca-gpunetio.explicit-positive.v1',
              'doca-urom-svc.explicit-positive.v1',
              'doca-programming-guide.negative.v1',
              'doca-flow-dpa-provider.negative.v1',
              'doca-public-knowledge-map.explicit-positive.v1',
          ]
          results = []
          with tempfile.TemporaryDirectory(prefix='docker-name-repro-') as directory:
              root = Path(directory)
              (root / 'Dockerfile').write_text('FROM scratch\nLABEL diagnostic="image-name-only"\n')
              compose = root / 'compose.json'
              compose.write_text(json.dumps({'services': {'main': {'build': {'context': directory}}}}))
              for task_name in cases:
                  task = SimpleNamespace(task=SimpleNamespace(get_task_id=lambda: SimpleNamespace(get_name=lambda: task_name)))
                  for phase, generate in [('original', original), ('corrected', corrected)]:
                      trial = generate(task)
                      project = re.sub(r'[^a-z0-9_-]', '-', (trial + '__env').lower())
                      result = subprocess.run(['docker', 'compose', '--project-name', project, '-f', str(compose), 'build'], capture_output=True, text=True)
                      output = result.stdout + result.stderr
                      expected_failure = phase == 'original' and task_name[:32].endswith('.')
                      assert (result.returncode != 0) == expected_failure, output
                      if expected_failure:
                          assert 'invalid reference format' in output, output
                      row = {'task': task_name, 'phase': phase, 'project': project, 'exitCode': result.returncode, 'invalidReference': 'invalid reference format' in output}
                      results.append(row)
                      print(json.dumps(row), flush=True)
          print('DOCKER_NAME_RESULTS=' + json.dumps(results), flush=True)
          assert sum(row['invalidReference'] for row in results) == 6
          PY

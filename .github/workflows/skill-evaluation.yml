name: Skill Evaluation Full Docker Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: a893d232b75c5a0f1e304adbf8234a602e659e3b
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.11"
      - uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.1.4
      - name: Install pinned evaluator and agent
        run: |
          git clone --quiet --branch v0.5.0 --depth 1 https://github.com/NVIDIA/SkillEvaluator.git /tmp/evaluator
          test "$(git -C /tmp/evaluator rev-parse HEAD)" = "7304d76cde371287b67ea99653409d014b6b9c85"
          uv sync --project /tmp/evaluator --extra tier3 --frozen
          uv run --project /tmp/evaluator --frozen --extra tier3 python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import harbor.models.trial.config as config

          if version("harbor") != "0.24.0":
              raise RuntimeError("Revalidate the trial-name compatibility fix for this Harbor version")
          path = Path(config.__file__)
          source = path.read_text()
          original = "task_name[:32].rstrip('_-')"
          corrected = "task_name[:32].rstrip('_-.')"
          if source.count(original) != 1 or corrected in source:
              raise RuntimeError("Unexpected Harbor trial-name implementation")
          # Replace the installed file without modifying uv's hardlinked wheel cache.
          staged = path.with_suffix(".clawhub-tmp")
          staged.write_text(source.replace(original, corrected))
          staged.replace(path)
          print("Applied Harbor 0.24.0 trailing-dot trial-name compatibility fix")
          PY
          npm install -g @openai/codex@0.148.0
      - name: Diagnose one exact evaluation without queue access
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > diagnostic-doca.ts <<'TS'
          import { lstat, readFile, readdir, rm } from 'node:fs/promises';
          import { join, relative } from 'node:path';
          import { parseSkillEvaluatorResultJson } from './convex/lib/skillEvaluationResult';
          import { NVIDIA_SKILL_EVALUATION_CONFIG as config } from './convex/lib/skillEvaluationConfig';
          import { commandEnvironment, evaluationEnvironment } from './scripts/evaluations/run-skill-evaluation-worker';
          import { startOpenAiCapabilityBroker } from './scripts/evaluations/openai-capability-broker';
          import { buildTier3Commands, findLatestResultJson, materializeNvidiaSkillsSnapshot, runCommand } from './scripts/evaluations/skill-evaluation-runtime';
          import { maskGitHubActionsSecret, maskKnownWorkerSecrets, redactWorkerPublicText } from './scripts/lib/workerRedaction';

          maskKnownWorkerSecrets();
          const apiKey = process.env.OPENAI_API_KEY;
          if (!apiKey) throw new Error('Missing diagnostic model credential');
          delete process.env.OPENAI_API_KEY;
          const secrets = [apiKey];
          const safe = (value: string) => redactWorkerPublicText(secrets.reduce((text, secret) => text.replaceAll(secret, '[redacted-secret]'), value), Number.MAX_SAFE_INTEGER);
          const snapshot = await materializeNvidiaSkillsSnapshot('392ab8ab2587345a9d86240967f666bd59ac82ca');
          let broker: Awaited<ReturnType<typeof startOpenAiCapabilityBroker>> | undefined;
          try {
            const skillDirectory = join(snapshot.checkout, 'skills/doca-compress');
            const resultsDirectory = join(snapshot.root, 'results');
            const commands = buildTier3Commands({ evaluatorProject: '/tmp/evaluator', skillDirectory, resultsDirectory, agent: config.agent, agentModel: config.agentModel, attempts: config.attemptsPerCase, environment: config.environment });
            const validation = await runCommand(commands.validate, { cwd: snapshot.checkout, env: commandEnvironment(), timeoutMs: 300_000 });
            if (validation.exitCode !== 0) throw new Error(safe(validation.stdout + validation.stderr));
            const gateway = await runCommand(['docker', 'network', 'inspect', 'bridge', '--format', '{{(index .IPAM.Config 0).Gateway}}'], { env: commandEnvironment() });
            if (gateway.exitCode !== 0 || !gateway.stdout.trim()) throw new Error('Docker gateway unavailable');
            broker = await startOpenAiCapabilityBroker({ allowedModels: [config.agentModel, config.judgeModel], apiKey });
            secrets.push(broker.capabilityToken);
            maskGitHubActionsSecret(broker.capabilityToken);
            async function trialProgress() {
              const progress = { finished: 0, exceptions: 0, environmentSetupsCompleted: 0 };
              const files = new Bun.Glob('**/result.json');
              for await (const file of files.scan({ cwd: resultsDirectory, absolute: true, onlyFiles: true, followSymlinks: false })) {
                if ((await lstat(file)).size > 1024 * 1024) continue;
                const trial = JSON.parse(await readFile(file, 'utf8').catch(() => '{}'));
                if (!trial.trial_name || !trial.task_name) continue;
                if (trial.finished_at) progress.finished++;
                if (trial.exception_info) progress.exceptions++;
                if (trial.environment_setup?.finished_at) progress.environmentSetupsCompleted++;
              }
              console.log(JSON.stringify({ diagnosticProgress: 'doca-compress', ...progress }));
            }
            const progressTimer = setInterval(() => { void trialProgress().catch(() => {}); }, 60_000);
            progressTimer.unref();
            console.log('Running pinned doca-compress evaluation with a 105-minute diagnostic budget.');
            const result = await runCommand([...commands.evaluate, '--harbor-keep-jobs'], { cwd: snapshot.checkout, env: evaluationEnvironment(config, { baseUrl: `http://${gateway.stdout.trim()}:${broker.port}/v1`, token: broker.capabilityToken }), timeoutMs: 105 * 60_000 });
            clearInterval(progressTimer);
            await trialProgress().catch(() => {});
            await broker.close();
            broker = undefined;
            console.log(JSON.stringify({ exitCode: result.exitCode, stdoutTail: safe(result.stdout).slice(-12_000), stderrTail: safe(result.stderr).slice(-12_000) }));
            let exceptions = 0;
            async function inspect(directory: string) {
              for (const entry of await readdir(directory, { withFileTypes: true }).catch(() => [])) {
                if (exceptions >= 4) return;
                const path = join(directory, entry.name);
                if (entry.isDirectory()) await inspect(path);
                else if (entry.isFile() && entry.name === 'exception.txt' && (await lstat(path)).size <= 1024 * 1024) {
                  console.log(JSON.stringify({ exception: relative(resultsDirectory, path), detail: safe(await readFile(path, 'utf8')).slice(-20_000) }));
                  exceptions++;
                }
              }
            }
            await inspect(resultsDirectory);
            const resultPath = await findLatestResultJson(resultsDirectory);
            const native = resultPath ? JSON.parse(await readFile(resultPath, 'utf8')) : undefined;
            console.log(JSON.stringify({ diagnostic: 'doca-compress', exitCode: result.exitCode, executionStatus: native?.execution_status, agentStatus: native?.agents?.codex?.execution_status, exceptions, nativeError: safe(JSON.stringify(native?.execution_errors ?? native?.error ?? [])) }));
            if (result.exitCode === 0) console.log(JSON.stringify({ validatedProductionMetrics: parseSkillEvaluatorResultJson(JSON.stringify(native), 'codex').metrics }));
            process.exitCode = result.exitCode;
          } catch (error) {
            console.log(JSON.stringify({ diagnosticError: safe(error instanceof Error ? error.stack ?? error.message : String(error)) }));
            process.exitCode = 1;
          } finally {
            if (broker) await broker.close();
            await rm(snapshot.root, { recursive: true, force: true });
          }
          TS
          bun diagnostic-doca.ts
      - name: Final host capacity
        if: always()
        run: |
          df -h /tmp
          free -m
          docker system df

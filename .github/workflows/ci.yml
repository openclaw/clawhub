name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VITE_CONVEX_URL: https://example.invalid

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-bun

      - name: Static checks
        run: bun run ci:static

  templates-openclaw-contract:
    name: templates-openclaw-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENCLAW_CONTRACT_REPOSITORY: openclaw/openclaw
      OPENCLAW_CONTRACT_SHA: 2cd23960ceb5f8cd7ebb003c37cf9e0c9776ade7

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-bun

      - name: Check out the pinned OpenClaw contract source
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.OPENCLAW_CONTRACT_REPOSITORY }}
          ref: ${{ env.OPENCLAW_CONTRACT_SHA }}
          path: .artifacts/openclaw-contract

      - name: Set up OpenClaw Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Locate the pinned OpenClaw pnpm store
        id: openclaw-store
        working-directory: .artifacts/openclaw-contract
        run: |
          corepack enable
          echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "runtime=$(node --version)-pnpm$(corepack pnpm --version)" >> "$GITHUB_OUTPUT"

      - name: Restore the pinned OpenClaw package store
        id: openclaw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.openclaw-store.outputs.path }}
          key: openclaw-contract-${{ runner.os }}-${{ runner.arch }}-${{ steps.openclaw-store.outputs.runtime }}-${{ env.OPENCLAW_CONTRACT_SHA }}-${{ hashFiles('.artifacts/openclaw-contract/pnpm-lock.yaml', '.artifacts/openclaw-contract/package.json') }}

      - name: Install pinned OpenClaw dependencies
        working-directory: .artifacts/openclaw-contract
        run: corepack pnpm install --frozen-lockfile

      - name: Run ClawHub to OpenClaw contract proof
        env:
          OPENCLAW_TEMPLATES_CHECKOUT: ${{ github.workspace }}/.artifacts/openclaw-contract
        run: bunx vitest run scripts/templates-feed-openclaw-e2e.test.ts --maxWorkers=1

      - name: Save the trusted OpenClaw package store
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.openclaw-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.openclaw-store.outputs.path }}
          key: ${{ steps.openclaw-cache.outputs.cache-primary-key }}

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup-bun

      - name: Record runner capacity
        run: |
          printf 'logical_cpus='
          nproc
          printf 'memory_total_kib='
          awk '/^MemTotal:/ { print $2 }' /proc/meminfo
          if [[ -r /sys/fs/cgroup/cpu.max ]]; then
            printf 'cpu_max='
            cat /sys/fs/cgroup/cpu.max
          fi
          if [[ -r /sys/fs/cgroup/cpu.stat ]]; then
            cat /sys/fs/cgroup/cpu.stat
          fi

      - name: Unit coverage
        env:
          CLAWHUB_CI_TEST_OBSERVATIONS: "1"
        run: bun run ci:unit

      - name: Upload test observations
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ci-test-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ci-test-observations/observations.json
          if-no-files-found: ignore
          retention-days: 7

  packages:
    name: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-bun

      - name: Package checks
        run: bun run ci:packages

  types-build:
    name: types-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-bun

      - name: Typecheck and build
        run: bunx --no-install tsrs --noEmit && VITE_CONVEX_URL=https://example.invalid bun run build

  e2e-http:
    name: e2e-http
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node.js for CLI compatibility
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - uses: ./.github/actions/setup-bun

      - name: HTTP e2e
        run: bun run ci:e2e-http

  playwright-smoke:
    name: playwright-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-bun

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(bun -e 'console.log(require("playwright-core/package.json").version)')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: bunx playwright install chromium

      - name: Browser e2e
        run: bun run ci:playwright-smoke

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  playwright-local-auth-shard:
    name: playwright-local-auth / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_LOCAL_AUTH_BACKEND_VERSION: precompiled-2026-10-22-1447815
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - name: account-cleanup
            specs: |
              e2e/local-auth/delete-account-resources.pw.test.ts
              e2e/local-auth/delete-org-resources.pw.test.ts
          - name: profile-context
            fixture_slug: local-agentic-risk-demo
            fixture_owner: local
            specs: |
              e2e/catalog-workflows.pw.test.ts
              e2e/local-auth/header-profile-link.pw.test.ts
              e2e/local-auth/manage-context-proof.pw.test.ts
              e2e/local-auth/plugin-catalog-api.pw.test.ts
              e2e/local-auth/publisher-create-owner.pw.test.ts
              e2e/local-auth/publisher-github-profile.pw.test.ts
              e2e/local-auth/skill-hero-metadata.pw.test.ts
              e2e/local-auth/skill-presentation-metadata.pw.test.ts
              e2e/local-auth/featured-lineup.pw.test.ts
          - name: catalog-mobile
            project: mobile-chrome
            fixture_slug: local-agentic-risk-demo
            fixture_owner: local
            specs: |
              e2e/catalog-workflows.pw.test.ts
              e2e/mobile-skills.pw.test.ts
          - name: template-artifacts
            specs: |
              e2e/local-auth/admin-download-analytics.pw.test.ts
              e2e/local-auth/exact-template-artifact.pw.test.ts
              e2e/local-auth/template-official-boundary.pw.test.ts
          - name: moderation-malicious
            specs: e2e/local-auth/malicious-skill-ban-flow.pw.test.ts
          - name: star-sync
            specs: e2e/local-auth/skill-star-sync.pw.test.ts
          - name: inspector-version
            specs: |
              e2e/local-auth/plugin-inspector-findings.pw.test.ts
              e2e/local-auth/plugin-api-retirements.pw.test.ts
              e2e/local-auth/package-ssr-identity.pw.test.ts
              e2e/local-auth/version-delete.pw.test.ts
          - name: publish-generated-card
            specs: e2e/local-auth/publish-skill-lifecycle.pw.test.ts
            grep: publishing a skill queues scan
          - name: publish-new-version
            specs: e2e/local-auth/publish-skill-lifecycle.pw.test.ts
            grep: skill publishers can create a skill|owner sees (failed publication|failed checks|incomplete checks)
          - name: publish-security
            specs: e2e/local-auth/publish-skill-lifecycle.pw.test.ts
            grep: clean skill publish|secret-positive pending skill upload|suspicious ClawScan verdict
          - name: old-cli-publish
            specs: e2e/local-auth/old-cli-publish-compat.pw.test.ts

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-bun

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(bun -e 'console.log(require("playwright-core/package.json").version)')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Cache the pinned Convex backend
        uses: actions/cache@v6
        with:
          path: ~/.cache/convex/binaries/${{ env.PLAYWRIGHT_LOCAL_AUTH_BACKEND_VERSION }}
          key: ${{ runner.os }}-${{ runner.arch }}-convex-${{ env.PLAYWRIGHT_LOCAL_AUTH_BACKEND_VERSION }}-7be627d8a8c9175b

      - name: Prepare the pinned Convex backend
        timeout-minutes: 5
        run: |
          set -euo pipefail
          backend_dir="$HOME/.cache/convex/binaries/$PLAYWRIGHT_LOCAL_AUTH_BACKEND_VERSION"
          if [[ -x "$backend_dir/convex-local-backend" ]]; then
            echo "Using cached Convex backend $PLAYWRIGHT_LOCAL_AUTH_BACKEND_VERSION"
            exit 0
          fi
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          # The release web URL intermittently returns errors; use the asset API.
          curl --fail --show-error --location --retry 3 --retry-all-errors \
            --retry-delay 5 --connect-timeout 15 --max-time 60 \
            --header 'Accept: application/octet-stream' \
            --output "$scratch/backend.zip" \
            https://api.github.com/repos/convex/convex-backend/releases/assets/667377511
          echo "7be627d8a8c9175b66a55cf6c4ab63c5f6bde1c412f59fbbe93f64a24a11bd13  $scratch/backend.zip" | sha256sum --check
          unzip -p "$scratch/backend.zip" convex-local-backend > "$scratch/convex-local-backend"
          install -D -m 755 "$scratch/convex-local-backend" "$backend_dir/convex-local-backend"

      - name: Cache npm packages for local Convex external dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-local-auth-npm-${{ hashFiles('bun.lock', 'convex.json') }}
          restore-keys: |
            ${{ runner.os }}-local-auth-npm-

      - name: Install Playwright browsers
        run: bunx playwright install chromium

      - name: Local-auth browser e2e
        env:
          PLAYWRIGHT_GREP: ${{ matrix.grep || '' }}
          PLAYWRIGHT_SPECS: ${{ matrix.specs }}
          PLAYWRIGHT_PROJECT: ${{ matrix.project || 'chromium' }}
          PLAYWRIGHT_LOCAL_AUTH_SEED_CATALOG: ${{ matrix.fixture_slug && '1' || '' }}
          CLAWHUB_E2E_SKILL_SLUG: ${{ matrix.fixture_slug || '' }}
          CLAWHUB_E2E_SKILL_OWNER: ${{ matrix.fixture_owner || '' }}
        run: |
          set -euo pipefail
          pressure_phase=before
          report_runner_pressure() {
            echo "::group::Local-auth runner pressure ($pressure_phase)"
            date --utc --iso-8601=seconds
            printf 'logical_cpus='
            nproc
            printf 'loadavg='
            cat /proc/loadavg
            if [[ -r /sys/fs/cgroup/cpu.stat ]]; then
              cat /sys/fs/cgroup/cpu.stat
            fi
            if [[ -r /proc/pressure/memory ]]; then
              cat /proc/pressure/memory
            fi
            free -h || true
            echo "::endgroup::"
          }
          report_runner_pressure
          pressure_phase=after
          trap report_runner_pressure EXIT

          mapfile -t specs < <(printf '%s\n' "$PLAYWRIGHT_SPECS" | sed '/^[[:space:]]*$/d')
          args=(--project="$PLAYWRIGHT_PROJECT" "${specs[@]}")
          if [[ -n "$PLAYWRIGHT_GREP" ]]; then
            args+=(--grep "$PLAYWRIGHT_GREP")
          fi
          bun run test:pw:local-auth -- "${args[@]}"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-local-auth-report-${{ matrix.name }}
          path: playwright-report/
          if-no-files-found: ignore

  playwright-local-auth:
    name: playwright-local-auth
    runs-on: ubuntu-latest
    needs: playwright-local-auth-shard
    if: ${{ always() }}
    timeout-minutes: 5

    steps:
      - name: Check local-auth shards
        env:
          LOCAL_AUTH_RESULT: ${{ needs.playwright-local-auth-shard.result }}
        run: |
          if [[ "$LOCAL_AUTH_RESULT" != "success" ]]; then
            echo "playwright-local-auth shards finished with result: $LOCAL_AUTH_RESULT"
            exit 1
          fi
          echo "playwright-local-auth shards passed."

name: Nonproduction ClawScan judge diagnostic
run-name: ${{ contains(fromJSON('["original-038-encrypted","original-079-encrypted","original-004-encrypted","original-016-encrypted","original-017-encrypted","original-026-encrypted","original-027-encrypted","original-074-encrypted","original-008-encrypted","original-011-encrypted","original-036-encrypted","original-033-encrypted","original-065-encrypted","original-073-encrypted","original-042-encrypted","original-055-encrypted","original-039-encrypted","original-010-encrypted","original-019-encrypted","original-005-encrypted","original-006-encrypted","original-015-encrypted","original-071-encrypted","original-007-encrypted","original-009-encrypted","original-014-encrypted","original-013-encrypted","original-029-encrypted","original-030-encrypted","original-002-encrypted","original-003-encrypted","original-067-encrypted"]'), inputs.fixture) && format('{0} {1}', inputs.fixture, inputs.age_recipient) || 'Nonproduction ClawScan judge diagnostic' }}

on:
  workflow_dispatch:
    inputs:
      fixture:
        description: "Nonpublishing fixed controls; original scanner-only never auto-runs full profile"
        required: true
        type: choice
        options:
          [
            tiny,
            incident,
            receipt-incident,
            small-timeout-paired,
            original-scanner-only,
            original-candidate-full,
            original-candidate-290-full,
            original-038-encrypted,
            original-079-encrypted,
            original-004-encrypted,
            original-016-encrypted,
            original-017-encrypted,
            original-026-encrypted,
            original-027-encrypted,
            original-074-encrypted,
            original-008-encrypted,
            original-011-encrypted,
            original-036-encrypted,
            original-033-encrypted,
            original-065-encrypted,
            original-073-encrypted,
            original-042-encrypted,
            original-055-encrypted,
            original-039-encrypted,
            original-010-encrypted,
            original-019-encrypted,
            original-005-encrypted,
            original-006-encrypted,
            original-015-encrypted,
            original-071-encrypted,
            original-007-encrypted,
            original-009-encrypted,
            original-014-encrypted,
            original-013-encrypted,
            original-029-encrypted,
            original-030-encrypted,
            original-002-encrypted,
            original-003-encrypted,
            original-067-encrypted,
          ]
        default: tiny
      source:
        description: "Reviewed repository pin or exact installed incident baseline (never latest)"
        required: true
        type: choice
        options: [reviewed, incident]
        default: reviewed
      runner:
        description: "Disposable runner; Ubuntu22 permits tiny controls or fixed original encrypted full capture"
        type: choice
        required: true
        default: blacksmith-16vcpu-ubuntu-2404
        options: [blacksmith-16vcpu-ubuntu-2404, ubuntu-22.04]
      age_recipient:
        description: "Per-run public age1 X25519 recipient; required only for fixed originals, never an identity"
        type: string
        required: false
        default: ""
      consumer:
        description: "Workflow source, or the fixed reviewed recovery consumer (never latest)"
        type: choice
        required: true
        options: [workflow, recovery-approved]
        default: workflow

permissions:
  contents: read

concurrency:
  group: nonproduction-clawscan-judge-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: >-
      github.repository == 'openclaw/clawhub' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      (inputs.runner == '' || inputs.runner == 'blacksmith-16vcpu-ubuntu-2404' ||
      (inputs.runner == 'ubuntu-22.04' && inputs.source == 'reviewed' &&
      (inputs.fixture == 'tiny' || contains(fromJSON('["original-038-encrypted","original-079-encrypted","original-004-encrypted","original-016-encrypted","original-017-encrypted","original-026-encrypted","original-027-encrypted","original-074-encrypted","original-008-encrypted","original-011-encrypted","original-036-encrypted","original-033-encrypted","original-065-encrypted","original-073-encrypted","original-042-encrypted","original-055-encrypted","original-039-encrypted","original-010-encrypted","original-019-encrypted","original-005-encrypted","original-006-encrypted","original-015-encrypted","original-071-encrypted","original-007-encrypted","original-009-encrypted","original-014-encrypted","original-013-encrypted","original-029-encrypted","original-030-encrypted","original-002-encrypted","original-003-encrypted","original-067-encrypted"]'), inputs.fixture)))) &&
      ((!contains(fromJSON('["original-038-encrypted","original-079-encrypted","original-004-encrypted","original-016-encrypted","original-017-encrypted","original-026-encrypted","original-027-encrypted","original-074-encrypted","original-008-encrypted","original-011-encrypted","original-036-encrypted","original-033-encrypted","original-065-encrypted","original-073-encrypted","original-042-encrypted","original-055-encrypted","original-039-encrypted","original-010-encrypted","original-019-encrypted","original-005-encrypted","original-006-encrypted","original-015-encrypted","original-071-encrypted","original-007-encrypted","original-009-encrypted","original-014-encrypted","original-013-encrypted","original-029-encrypted","original-030-encrypted","original-002-encrypted","original-003-encrypted","original-067-encrypted"]'), inputs.fixture)) ||
      (inputs.runner == 'ubuntu-22.04' && inputs.source == 'reviewed' && github.run_attempt == 1))
    runs-on: ${{ inputs.runner == 'ubuntu-22.04' && 'ubuntu-22.04' || 'blacksmith-16vcpu-ubuntu-2404' }}
    environment: Production
    timeout-minutes: ${{ inputs.fixture == 'original-scanner-only' && 120 || 80 }}
    env:
      CLAWSCAN_DIAGNOSTIC_RUNNER: ${{ inputs.runner == 'ubuntu-22.04' && 'ubuntu-22.04' || 'blacksmith-16vcpu-ubuntu-2404' }}
      GOTOOLCHAIN: go1.27.3
    steps:
      - name: Validate diagnostic consumer selection
        id: consumer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONSUMER_CHOICE: ${{ inputs.consumer }}
          FIXTURE_CHOICE: ${{ inputs.fixture }}
          SOURCE_CHOICE: ${{ inputs.source }}
          RUNNER_CHOICE: ${{ inputs.runner }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == openclaw/clawhub ]] || exit 1
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main ]] || exit 1
          [[ "$GITHUB_WORKFLOW_REF" == openclaw/clawhub/.github/workflows/clawscan-judge-diagnostic.yml@refs/heads/main ]] || exit 1
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]] || exit 1
          case "${CONSUMER_CHOICE:-workflow}" in
            workflow)
              consumer_sha="$GITHUB_SHA"
              ;;
            recovery-approved)
              [[ "$GITHUB_ACTOR" == Patrick-Erichsen && "$GITHUB_TRIGGERING_ACTOR" == Patrick-Erichsen ]] || exit 1
              [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$SOURCE_CHOICE" == reviewed && "$RUNNER_CHOICE" == ubuntu-22.04 ]] || exit 1
              [[ "$FIXTURE_CHOICE" =~ ^original-(038|079|004|016|017|026|027|074|008|011|036|033|065|073|042|055|039|010|019|005|006|015)-encrypted$ ]] || exit 1
              # Keep the consumer's reviewed code and dependencies stable as main advances.
              consumer_sha=39c955143f13aa4ddb4c47272262e7e82e3e5340
              comparison=$(gh api --method GET "repos/openclaw/clawhub/compare/${consumer_sha}...${GITHUB_SHA}" \
                --jq '[.base_commit.sha,.merge_base_commit.sha,(.status == "ahead" or .status == "identical")]|@tsv')
              [[ "$comparison" == "$(printf '%s\t%s\ttrue' "$consumer_sha" "$consumer_sha")" ]] || exit 1
              ;;
            *) exit 1 ;;
          esac
          printf 'consumer-sha=%s\nworkflow-sha=%s\n' "$consumer_sha" "$GITHUB_WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          printf 'workflow_commit=%s consumer_commit=%s\n' "$GITHUB_WORKFLOW_SHA" "$consumer_sha"
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.consumer.outputs.consumer-sha }}
          persist-credentials: false
      - name: Verify diagnostic consumer checkout
        shell: bash
        env:
          EXPECTED_CONSUMER_SHA: ${{ steps.consumer.outputs.consumer-sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_CONSUMER_SHA" ]] || exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.16"
      - name: Install pinned Codex without login
        uses: ./.github/actions/setup-codex
      - name: Install fixed diagnostic encryption and sandbox tools
        if: ${{ contains(fromJSON('["original-038-encrypted","original-079-encrypted","original-004-encrypted","original-016-encrypted","original-017-encrypted","original-026-encrypted","original-027-encrypted","original-074-encrypted","original-008-encrypted","original-011-encrypted","original-036-encrypted","original-033-encrypted","original-065-encrypted","original-073-encrypted","original-042-encrypted","original-055-encrypted","original-039-encrypted","original-010-encrypted","original-019-encrypted","original-005-encrypted","original-006-encrypted","original-015-encrypted","original-071-encrypted","original-007-encrypted","original-009-encrypted","original-014-encrypted","original-013-encrypted","original-029-encrypted","original-030-encrypted","original-002-encrypted","original-003-encrypted","original-067-encrypted"]'), inputs.fixture) }}
        id: encryption
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sh scripts/security/install-diagnostic-age.sh
      - name: Select bounded installer source
        if: ${{ inputs.fixture != 'original-scanner-only' && inputs.fixture != 'original-candidate-full' && inputs.fixture != 'original-candidate-290-full' && !contains(fromJSON('["original-038-encrypted","original-079-encrypted","original-004-encrypted","original-016-encrypted","original-017-encrypted","original-026-encrypted","original-027-encrypted","original-074-encrypted","original-008-encrypted","original-011-encrypted","original-036-encrypted","original-033-encrypted","original-065-encrypted","original-073-encrypted","original-042-encrypted","original-055-encrypted","original-039-encrypted","original-010-encrypted","original-019-encrypted","original-005-encrypted","original-006-encrypted","original-015-encrypted","original-071-encrypted","original-007-encrypted","original-009-encrypted","original-014-encrypted","original-013-encrypted","original-029-encrypted","original-030-encrypted","original-002-encrypted","original-003-encrypted","original-067-encrypted"]'), inputs.fixture) }}
        env:
          SOURCE_CHOICE: ${{ inputs.source }}
          FIXTURE_CHOICE: ${{ inputs.fixture }}
        run: |
          set -euo pipefail
          if [ "$FIXTURE_CHOICE" = small-timeout-paired ] && [ "$SOURCE_CHOICE" != reviewed ]; then exit 1; fi
          installer=$(mktemp -d "$RUNNER_TEMP/clawscan-diagnostic-installer.XXXXXX")
          cp scripts/security/install-clawscan.sh scripts/security/install-clawscan-scanners.sh scripts/security/aig-worker-requirements.txt scripts/security/clawscan-source-commit.txt "$installer/"
          case "$SOURCE_CHOICE" in
            reviewed) ;;
            incident) printf '%s\n' e9d0e9e05506d9e9aa9725fe2f4da20e2870db9b > "$installer/clawscan-source-commit.txt" ;;
            *) exit 1 ;;
          esac
          printf 'DIAGNOSTIC_INSTALLER=%s\n' "$installer" >> "$GITHUB_ENV"
          sh "$installer/install-clawscan.sh"
      - name: Install matched reviewed scanner sources and Responses adapters
        if: ${{ inputs.fixture != 'original-scanner-only' && inputs.fixture != 'original-candidate-full' && inputs.fixture != 'original-candidate-290-full' && !contains(fromJSON('["original-038-encrypted","original-079-encrypted","original-004-encrypted","original-016-encrypted","original-017-encrypted","original-026-encrypted","original-027-encrypted","original-074-encrypted","original-008-encrypted","original-011-encrypted","original-036-encrypted","original-033-encrypted","original-065-encrypted","original-073-encrypted","original-042-encrypted","original-055-encrypted","original-039-encrypted","original-010-encrypted","original-019-encrypted","original-005-encrypted","original-006-encrypted","original-015-encrypted","original-071-encrypted","original-007-encrypted","original-009-encrypted","original-014-encrypted","original-013-encrypted","original-029-encrypted","original-030-encrypted","original-002-encrypted","original-003-encrypted","original-067-encrypted"]'), inputs.fixture) }}
        run: |
          set -euo pipefail
          sh "$DIAGNOSTIC_INSTALLER/install-clawscan-scanners.sh" aig
          sh "$DIAGNOSTIC_INSTALLER/install-clawscan-scanners.sh" skillspector
      - name: Run isolated nonpublishing diagnostic
        id: probe
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.CODEX_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY || secrets.OPENAI_API_KEY }}
          FIXTURE_CHOICE: ${{ inputs.fixture }}
          SOURCE_CHOICE: ${{ inputs.source }}
          DIAGNOSTIC_AGE_RECIPIENT: ${{ inputs.age_recipient }}
          DIAGNOSTIC_AGE_BINARY: ${{ steps.encryption.outputs.age-binary }}
          DEFAULT_MODEL: ${{ vars.DEFAULT_MODEL || 'gpt-6.1-sol' }}
          REASONING_EFFORT: ${{ vars.REASONING_EFFORT || 'medium' }}
          SKILLSPECTOR_MODEL: ${{ vars.SKILLSPECTOR_MODEL || 'gpt-6.1-sol' }}
          SKILLSPECTOR_REASONING_EFFORT: ${{ vars.SKILLSPECTOR_REASONING_EFFORT || 'medium' }}
        run: bun scripts/security/run-clawscan-diagnostic.ts --fixture "$FIXTURE_CHOICE" --source "$SOURCE_CHOICE"
      - name: Upload allowlisted metadata only
        if: ${{ !cancelled() && steps.probe.outputs.safe-output != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: NONPRODUCTION_DIAGNOSTIC-${{ github.run_id }}
          path: |
            ${{ steps.probe.outputs.safe-output }}/summary.json
            ${{ steps.probe.outputs.safe-output }}/events.jsonl
            ${{ steps.probe.outputs.safe-output }}/attestation.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload encrypted fixed original evidence only
        if: ${{ !cancelled() && steps.probe.outputs.encrypted-output != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ENCRYPTED_ORIGINAL${{ inputs.fixture == 'original-079-encrypted' && '079' || inputs.fixture == 'original-004-encrypted' && '004' || inputs.fixture == 'original-016-encrypted' && '016' || inputs.fixture == 'original-017-encrypted' && '017' || inputs.fixture == 'original-026-encrypted' && '026' || inputs.fixture == 'original-027-encrypted' && '027' || inputs.fixture == 'original-074-encrypted' && '074' || inputs.fixture == 'original-008-encrypted' && '008' || inputs.fixture == 'original-011-encrypted' && '011' || inputs.fixture == 'original-036-encrypted' && '036' || inputs.fixture == 'original-033-encrypted' && '033' || inputs.fixture == 'original-065-encrypted' && '065' || inputs.fixture == 'original-073-encrypted' && '073' || inputs.fixture == 'original-042-encrypted' && '042' || inputs.fixture == 'original-055-encrypted' && '055' || inputs.fixture == 'original-039-encrypted' && '039' || inputs.fixture == 'original-010-encrypted' && '010' || inputs.fixture == 'original-019-encrypted' && '019' || inputs.fixture == 'original-005-encrypted' && '005' || inputs.fixture == 'original-006-encrypted' && '006' || inputs.fixture == 'original-015-encrypted' && '015' || inputs.fixture == 'original-071-encrypted' && '071' || inputs.fixture == 'original-007-encrypted' && '007' || inputs.fixture == 'original-009-encrypted' && '009' || inputs.fixture == 'original-014-encrypted' && '014' || inputs.fixture == 'original-013-encrypted' && '013' || inputs.fixture == 'original-029-encrypted' && '029' || inputs.fixture == 'original-030-encrypted' && '030' || inputs.fixture == 'original-002-encrypted' && '002' || inputs.fixture == 'original-003-encrypted' && '003' || inputs.fixture == 'original-067-encrypted' && '067' || '038' }}-${{ github.run_id }}
          path: |
            ${{ steps.probe.outputs.encrypted-output }}/capture.tar.gz.age
            ${{ steps.probe.outputs.encrypted-output }}/receipt.json
          if-no-files-found: error
          retention-days: 7
